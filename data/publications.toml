[[publication]]
type = "article"
title = "FedSyn: Synthetic Data Generation using Federated Learning"
pub_year = 2022
author = [
    "*Monik Raj Behera*",
    "Sudhir Upadhyay",
    "Suresh Shetty",
    "Sudha Priyadarshini",
    "Palka Patel",
    "Ker Farn Lee",
]
abstract = "As Deep Learning algorithms continue to evolve and become more sophisticated, they require massive datasets for model training and efficacy of models. Some of those data requirements can be met with the help of existing datasets within the organizations. Current Machine Learning practices can be leveraged to generate synthetic data from an existing dataset. Further, it is well established that diversity in generated synthetic data relies on (and is perhaps limited by) statistical properties of available dataset within a single organization or entity. The more diverse an existing dataset is, the more expressive and generic synthetic data can be. However, given the scarcity of underlying data, it is challenging to collate big data in one organization. The diverse, non-overlapping dataset across distinct organizations provides an opportunity for them to contribute their limited distinct data to a larger pool that can be leveraged to further synthesize. Unfortunately, this raises data privacy concerns that some institutions may not be comfortable with. This paper proposes a novel approach to generate synthetic data - FedSyn. FedSyn is a collaborative, privacy preserving approach to generate synthetic data among multiple participants in a federated and collaborative network. FedSyn creates a synthetic data generation model, which can generate synthetic data consisting of statistical distribution of almost all the participants in the network. FedSyn does not require access to the data of an individual participant, hence protecting the privacy of participant's data. The proposed technique in this paper leverages federated machine learning and generative adversarial network (GAN) as neural network architecture for synthetic data generation. The proposed method can be extended to many machine learning problem classes in finance, health, governance, technology and many more."
journal = "arXiv preprint"
url = "https://arxiv.org/abs/2203.05931"

[[publication]]
type = "article"
title = "Federated Learning using Smart Contracts on Blockchains, based on Reward Driven Approach"
pub_year = 2021
author = [
    "*Monik Raj Behera*",
    "Sudhir Upadhyay",
    "Suresh Shetty",
]
abstract = "Over the recent years, Federated machine learning continues to gain interest and momentum where there is a need to draw insights from data while preserving the data provider's privacy. However, one among other existing challenges in the adoption of federated learning has been the lack of fair, transparent and universally agreed incentivization schemes for rewarding the federated learning contributors. Smart contracts on a blockchain network provide transparent, immutable and independently verifiable proofs by all participants of the network. We leverage this open and transparent nature of smart contracts on a blockchain to define incentivization rules for the contributors, which is based on a novel scalar quantity - federated contribution. Such a smart contract based reward-driven model has the potential to revolutionize the federated learning adoption in enterprises. Our contribution is two-fold: first is to show how smart contract based blockchain can be a very natural communication channel for federated learning. Second, leveraging this infrastructure, we can show how an intuitive measure of each agents' contribution can be built and integrated with the life cycle of the training and reward process."
journal = "arXiv preprint"
url = "https://arxiv.org/abs/2107.10243"

[[publication]]
type = "article"
title = "Paving the way towards 800 Gbps quantum-secured optical channel deployment in mission-critical environments"
pub_year = 2022
author = [
    "Marco Pistoia",
    "Omar Amer",
    "*Monik Raj Behera*",
    "Joseph A Dolphin",
    "James F Dynes",
    "Benny John",
    "Paul Haigh",
    "Yasushi Kawakura",
    "David H Kramer",
    "Jeffery Lyon",
]
abstract = "This article describes experimental research studies conducted toward understanding the implementation aspects of high-capacity quantum-secured optical channels in mission-critical metro-scale operational environments using quantum key distribution (QKD) technology. To the best of our knowledge, this is the first time that an 800 Gbps quantum-secured optical channel—along with several other dense wavelength division multiplexed channels on the C-band and multiplexed with the QKD channel on the O-band-was established at distances up to 100 km, with secret key-rates relevant for practical industry use cases. In addition, during the course of these trials, transporting a blockchain application over this established channel was utilized as a demonstration of securing a financial transaction in transit over a quantum-secured optical channel. The findings of this research pave the way toward the deployment of QKD-secured optical channels in high-capacity, metro-scale, mission-critical operational environments, such as Inter-Data Center Interconnects."
journal = "Quantum Science and Technology"
volume = "8"
url = "https://iopscience.iop.org/article/10.1088/2058-9565/acd1a8/meta"

[[publication]]
type = "article"
title = "pFedGame-Decentralized Federated Learning Using Game Theory in Dynamic Topology"
pub_year = 2024
author = [
    "*Monik Raj Behera*",
    "Suchetana Chakraborty",
]
journal = "2024 16th International Conference on COMmunication Systems & NETworkS (COMSNETS)"
volume = "651-655"
abstract = "Conventional federated learning frameworks suffer from several challenges including performance bottlenecks at the central aggregation server, data bias, poor model convergence, and exposure to model poisoning attacks, and limited trust in the centralized infrastructure. In the current paper, a novel game theory-based approach called 'pFedGame' is proposed for decentralized federated learning, best suitable for temporally dynamic networks. The proposed algorithm works without any centralized server for aggregation and incorporates the problem of vanishing gradients and poor convergence over temporally dynamic topology among federated learning participants. The solution comprises two sequential steps in every federated learning round, for every participant. First, it selects suitable peers for collaboration in federated learning. Secondly, it executes a two-player constant sum cooperative game to reach convergence by applying an optimal federated learning aggregation strategy. Experiments performed to assess the performance of pFedGame in comparison to existing methods in decentralized federated learning have shown promising results with accuracy higher than 70% for heterogeneous data."
url = "https://ieeexplore.ieee.org/abstract/document/10427470"

[[publication]]
type = "article"
title = "Federated Learning using Distributed Messaging with Entitlements for Anonymous Computation and Secure Delivery of Model"
pub_year = 2020
author = [
    "*Monik Raj Behera*",
    "Sudhir upadhyay",
    "Robert Otter",
    "Suresh Shetty",
]
journal = "TechRxiv preprint"
abstract = "Federated learning has become one of the most recent and widely researched areas of machine learning. Several machine-learning frameworks, such as Tensorflow Federated and PySyft and others have gained momentum in recent past and continue to evolve. Some of the frameworks involve techniques such as differential privacy, secure multi-party computation, gradient descent calculation over the network to achieve privacy of underlying data in federated learning. While these frameworks serve the need for a general-purpose federated learning model as per certain framework, in this paper we present a solution based on distributed messaging with appropriate entitlements that enterprises can leverage in a managed and permissioned network. The solution implements access controls on message source and destination in a decentralized network, which can implement any given data science model in the federated network to facilitate secure federated learning."
url = "https://www.techrxiv.org/doi/full/10.36227/techrxiv.13318163.v1"

[[publication]]
type = "article"
title = "Federated Learning using Peer-to-peer Network for Decentralized Orchestration of Model Weights"
pub_year = 2021
author = [
    "*Monik Raj Behera*",
    "Sudhir upadhyay",
    "Robert Otter",
    "Suresh Shetty",
]
journal = "TechRxiv preprint"
abstract = "In recent times, Machine learning and Artificial intelligence have become one of the key emerging fields of computer science. Many researchers and businesses are benefited by machine learning models that are trained by data processing at scale. However, machine learning, and particularly Deep Learning requires large amounts of data, that in several instances are proprietary and confidential to many businesses. In order to respect individual organization's privacy in collaborative machine learning, federated learning could play a crucial role. Such implementations of privacy preserving federated learning find applicability in various ecosystems like finance, health care, legal, research and other fields that require preservation of privacy. However, many such implementations are driven by a centralized architecture in the network, where the aggregator node becomes the single point of failure, and is also expected with lots of computing resources at its disposal. In this paper, we propose an approach of implementing a decentralized, peer-topeer federated learning framework, that leverages RAFT based aggregator selection. The proposal hinges on that fact that there is no one permanent aggregator, but instead a transient, time based elected leader, which will aggregate the models from all the peers in the network. The leader ( aggregator) publishes the aggregated model on the network, for everyone to consume. Along with peer-to-peer network and RAFT based aggregator selection, the framework uses dynamic generation of cryptographic keys, to create a more secure mechanism for delivery of models within the network. The key rotation also ensures anonymity of the sender on the network too. Experiments conducted in the paper, verifies the usage of peer-to-peer network for creating a resilient federated learning network. Although the proposed solution uses an artificial neural network in it's reference implementation, the generic design of the framework can accommodate any federated learning model within the network."
url = "https://www.techrxiv.org/doi/pdf/10.36227/techrxiv.14267468"

[[publication]]
type = "article"
title = "Right Tool, Wrong Arguments: Permission Drift in Quantized Tool-Calling LLMs"
pub_year = 2026
author = [
    "*Monik Raj Behera*",
    "Sivadinesh Ponrajan",
    "Thorsteinn S Rögnvaldsson",
    "Prayag Tiwari"
]
journal = "2026 40th Annual Conference on Neural Information Processing Systems (NeurIPS)"
volume = "On-Device Intelligence: Foundation Models under Real-World Constraints Workshop"
abstract = "Post-training quantization is the standard way to deploy tool-using language model agents on constrained hardware, and is generally assumed safe once it preserves benchmark accuracy. We test that assumption across four tool-calling model families (Qwen, Llama, Mistral, and Granite) at four precisions (BF16, FP8, INT8, and INT4). On the Berkeley Function-Calling Leaderboard, three families lose at most 2.17 accuracy points at INT4 and one improves by over 11 points: aggregate tool-calling capability largely survives quantization. A paired, case-level analysis of the same predictions tells a different story - up to 13.50% of individual decisions change between BF16 and INT4, even when aggregate accuracy remains stable or improves. We then introduce a permission-boundary analysis that gives each model an explicitly authorized tool call and measures whether untrusted external content changes the arguments it supplies. Every family exhibits at least one reproducible case where a securely authorized BF16 action becomes unauthorized at INT4, and INT4 changes 20-50% of permission records relative to BF16. Argument churn also exceeds tool-selection churn across all four families. These transitions are deterministic under repeated greedy decoding, although none of the 36 primary security comparisons survive Holm correction; the evidence therefore establishes case-level instability rather than population-wide average degradation. We call this failure mode permission drift: quantization can leave aggregate tool-calling accuracy intact while silently moving sensitive arguments outside the user's authorization boundary."
url = "https://neurips.cc/virtual/2026/loc/sydney/170063"

[[publication]]
type = "article"
title = "Decoupled Planning and Execution for Trustworthy Agents in Closed-Environment"
pub_year = 2026
author = [
    "*Monik Raj Behera*",
    "Preetam Nahak",
    "Ajit K Behera",
    "Zahra Taghiyarrenani",
    "Yuantao Fan",
    "Thorsteinn S Rögnvaldsson"
]
journal = "2026 40th Annual Conference on Neural Information Processing Systems (NeurIPS)"
volume = "Agentic AI Benchmark and Application for Enterprise Tasks Workshop"
abstract = "Enterprise systems rely heavily on LLM agents with typically large models(with parameters) to execute multi-step procedures. They use a dynamic approach; first the agent creates a plan and uses it to execute the input query and generate output. These agents do not require any offline preparation, yet they still fail in producing consistent results despite using a powerful model, rendering them unreliable. We presume that dynamic re-planning not only causes structural drifts, but also amounts to repeated redundant token costs. Existing literature points towards Localized task decomposition bounds updates within sub-tasks, complementing prior efforts that employ graph constraints, delta patching, and topological separation to safeguard global dependencies to mitigate the shortcomings, which motivates us to study a hybrid approach of query resolution that involves decoupling of planning and execution paths and employing DAGs(Directed Acyclic Graphs) to represent pre-defined workflows. We conducted two studies in closed environment setup. First, we study two different systems across a custom benchmark and do a cost analysis; one uses traditional dynamic approach and other one uses the hybrid approach. Then we study the novel hybrid system against three graph compiler models of different sizes. Results obtained from these studies suggest that the hybrid approach is more reliable, accurate and cheaper and that smaller compiler model performs fairly in ingestion phase, hence supporting central claim that small model executing a well-structured, pre-compiled plan is cheaper and more reliable than dynamic re-planning."
url = "https://neurips.cc/virtual/2026/loc/sydney/160078"