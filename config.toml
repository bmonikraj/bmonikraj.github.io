# The URL the site will be built for
base_url = "https://bmonikraj.github.io"
title = "Monik Raj Behera"
description = "Researcher in Artificial Intelligence"
theme = "peritus"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here

# Personal information
name = "Monik Raj Behera"
role = "Doctoral Student in Machine Learning"
organization = "Halmstad University"
location = "Halmstad, Sweden"
email = "monik.raj.behera@hh.se"
last_name_identifier = "Behera"
organization_url = "https://www.hh.se/english/information-english/search-staff.html?person=22542F17-CEA5-49B7-94B4-9356AB807781"
cv_url = ""

# Bio/about section
bio = """
I work at the *[Center for Applied Intelligent Systems Research (CAISR)](https://www.hh.se/english/research/our-research/research-at-the-school-of-information-technology/center-for-applied-intelligent-systems-research-caisr.html)* in *[Halmstad University](https://www.hh.se/english.html)*. My research focuses on **Algorithms and Systems for Generative AI, Deep Learning and Privacy Preserving AI**.
"""

# Features to enable
enable_dark_mode = true

