# Bio/about section
bio = """
I am a doctoral student in machine learning at *[Halmstad University](https://www.hh.se/english.html)*, in the *[CAISR](https://www.hh.se/english/research/our-research/research-at-the-school-of-information-technology/center-for-applied-intelligent-systems-research-caisr.html)* group. My research sits at the intersection of multi agent systems and distributed learning with generative AI: how learning agents, from expert learners to Generative AI-based agents, can cooperate, coordinate and optimize together when data, compute and decisions are distributed across many parties. I work on distributed optimization and learning and on cooperative learning, ranging from decentralized, game theoretic training without a central server to generative agents that plan and act reliably through tools and shared workflows.

I bring over seven years of industry experience at J.P. Morgan, Rakuten, Visa, Capital One and Volvo, building federated learning, information retrieval and generative AI systems at production scale.
"""

