# Colour theme — "Academic Blue": near-black ink-indigo headings on a cool paper
# canvas, with one deep, restrained blue accent. All text pairs pass WCAG AA:
#   accent on light canvas 6.9:1, white on accent fill 7.5:1, dark accent on dark canvas 7.9:1.
# Earlier themes (High Tech Minimalist, Academic Classic, Nordic, Modern Monograph,
# Indigo Nordic, Foundational Indigo) are in git history.
[extra.colors]
# Light mode
primary_color = "#1B2340"      # Ink-indigo — headings, primary emphasis
secondary_color = "#545B6B"    # Graphite-slate — secondary text
accent_color = "#2B4CB3"       # Academic blue — links, highlights; also every solid fill behind white text
text_color = "#1A1D29"         # Ink black
background_color = "#F4F5F7"   # Cool paper white
card_background = "#FFFFFF"
border_color = "#E1E4E8"

# Dark mode — primary/secondary/accent get lighter tints of the same hues so text
# stays legible on the near-black canvas (all > 7.5:1). Solid fills keep the
# light-mode accent, since they always carry white text.
dark_text_color = "#ECEBE6"
dark_background_color = "#0E1220"
dark_card_background = "#171B2C"
dark_border_color = "#262B3D"
dark_primary_color = "#A6B0E8"
dark_secondary_color = "#9BA3B8"
dark_accent_color = "#8FA4FF"
